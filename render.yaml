services:
  - type: web
    name: yourday
    runtime: node
    buildCommand: npm ci && npm run build && pip install auto-editor --quiet
    startCommand: node server.js
    healthCheckPath: /api/push/vapid-key
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: RESEND_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
